<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner glow border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Open Book Icon Artwork -->
  <g transform="translate(96, 120)" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Page -->
    <path d="M160 220 C100 170 30 180 0 200 L0 30 C30 10 100 0 160 50 Z" fill="#ffffff" fill-opacity="0.95" stroke="#ffffff"/>
    <!-- Right Page -->
    <path d="M160 220 C220 170 290 180 320 200 L320 30 C290 10 220 0 160 50 Z" fill="#ffffff" stroke="#ffffff"/>
    <!-- Book Spine Center -->
    <line x1="160" y1="50" x2="160" y2="230" stroke="url(#goldGrad)" stroke-width="16"/>
  </g>
  
  <!-- Bookmark Ribbon -->
  <polygon points="256,120 286,120 286,220 256,195 226,220 226,120" fill="url(#goldGrad)"/>
</svg>
